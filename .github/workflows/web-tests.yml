name: Web Tests - SauceDemo

on:
  push:
    paths:
      - 'web-tests/**'
  pull_request:
    paths:
      - 'web-tests/**'
  workflow_dispatch:

jobs:
  web-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Instalar dependências
        working-directory: web-tests
        run: pip install -r requirements.txt

      - name: Executar testes Web
        working-directory: web-tests
        run: pytest tests/ -v --html=report.html --self-contained-html

      - name: Upload do relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-test-report
          path: web-tests/report.html
